summary: Admin page reachable without admin authentication and Loki form actions without ACL check
details: >
  In version 1.0.0 the admin controller example_loki_admin_components/index/index implemented
  HttpGetActionInterface without extending Magento\Backend\App\Action. Because of this, Magento's admin
  authentication plugin and ACL check were never applied, and the admin page of this module, including its
  Loki form, could be opened without logging in to the Admin Panel. In addition, the Loki form loads, saves and
  deletes on that page were not bound to any ACL resource, so any logged-in admin user could use them regardless
  of their role. Version 1.0.1 makes the controller extend Magento\Backend\App\Action with the ACL resource
  YireoTraining_ExampleLokiAdminComponents::form and binds the Loki form actions to that same resource.
  Users of 1.0.0 should upgrade to 1.0.1 and review which admin roles are granted the new ACL resource.
